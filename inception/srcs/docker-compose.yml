services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:Inception
    container_name: mariadb
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/mysqld/.ready && mariadb-admin -u root -p\"$${MARIADB_ROOT_PASSWORD}\" ping --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:Inception
    container_name: wordpress
    restart: on-failure
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:Inception
    container_name: nginx
    restart: on-failure
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html

networks:
  inception:
    name: inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mzanana/data/mariadb  
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mzanana/data/wordpress